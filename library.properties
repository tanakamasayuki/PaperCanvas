name=PaperCanvas
version=0.0.0
author=TANAKA Masayuki
maintainer=TANAKA Masayuki
sentence=Monochrome 1bpp bitmap generator for receipt and label printers.
paragraph=Lays out text, images and barcodes on a receipt (fixed width, content-driven height) or a label (fixed canvas) and produces a printer-independent 1bpp bitmap. Tiling is delegated to LGFXVirtualCanvas so memory stays constant for long receipts and pages can be streamed band by band. Printer commands, transports and barcode encoding are deliberately out of scope.
category=Display
url=https://github.com/tanakamasayuki/PaperCanvas
architectures=*
includes=PaperCanvas.h
depends=LovyanGFX,LGFXVirtualCanvas
